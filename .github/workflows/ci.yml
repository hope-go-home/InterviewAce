name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 单元测试 + 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx pydantic python-dotenv "langchain-openai>=0.1" \
                      "langchain-core>=0.2" langchain-community langchain-text-splitters \
                      fastapi python-multipart PyJWT passlib[bcrypt] \
                      sqlalchemy pymysql pymilvus prometheus-client tenacity

      - name: 编译检查（所有模块可正常解析）
        run: python -m compileall -q legacy-python/interviewace legacy-python/data_pipeline

      - name: 单元测试
        run: pytest legacy-python/tests/ -q
        # 集成测试在 CI 里没有 Milvus/MySQL，会自动 skip；单测必须全绿

  eval-gate:
    name: 评测回归门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 校验评测指标未回归
        run: python legacy-python/scripts/eval_gate.py --tier B
        # 仅比对已提交的评测报告与基线（不需要 Milvus/MySQL）
        # 指标跌超 3% 即失败，阻断合并

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

  backend-java:
    name: Java 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 单元测试 + 契约测试 + H2 回归测试
        run: mvn -B test
        # 全部用例不依赖外部服务：Service 层 Mockito / Controller standalone MockMvc /
        # Mapper 层 H2 内存库（MySQL 模式跑真实 SQL）
